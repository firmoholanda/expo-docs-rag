<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>expo docs rag evals</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  h2 { font-size: var(--f4); margin: var(--s5) 0 var(--s3); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s3); }
  .tile .v { font-size: var(--f6); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .tile .l { color: var(--muted); font-size: var(--f2); margin-top: var(--s1); }
  .bars { display: grid; gap: var(--s3); }
  .bar-row { display: grid; grid-template-columns: 90px 1fr 56px; gap: var(--s3); align-items: center; font-size: var(--f2); }
  .track { background: var(--code); border-radius: 999px; height: 12px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; }
  .legend { display: flex; gap: var(--s4); flex-wrap: wrap; margin-bottom: var(--s3); font-size: var(--f2); color: var(--muted); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: var(--s1); }
  table { width: 100%; border-collapse: collapse; font-size: var(--f2); }
  th, td { text-align: left; padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: var(--f1); text-transform: lowercase; }
  .rank { display: inline-block; min-width: 2.4em; text-align: center; border-radius: 999px; padding: 0 var(--s2); font-weight: 700; font-size: var(--f1); }
  .r-good { background: var(--accent-soft); color: var(--accent); }
  .r-mid { background: var(--warn-soft); color: var(--warn); }
  .r-bad { background: var(--bad-soft); color: var(--bad); }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <svg class="icon" viewBox="0 0 24 24" style="width:26px;height:26px;color:var(--accent)"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
  <h1>evals</h1>
  <nav><a href="/">chat</a><a class="on" href="/evals">evals</a></nav>
</header>
<main>
  <div id="root"><p class="muted">loading…</p></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (x) => Math.round(x * 100) + "%";
const MODE_NAME = { bm25: "keyword", dense: "semantic", hybrid: "hybrid" };
const MODE_COLOR = { bm25: "var(--warn)", dense: "#4f7cc4", hybrid: "var(--accent)" };
const icon = (d) => `<svg class="icon" viewBox="0 0 24 24">${d}</svg>`;

function tile(label, value, ic) { return `<div class="card tile"><div class="l">${ic}${label}</div><div class="v">${value}</div></div>`; }

function rankBadge(r) {
  if (r == null) return `<span class="rank r-bad">miss</span>`;
  return `<span class="rank ${r === 1 ? "r-good" : "r-mid"}">#${r}</span>`;
}

function compare(retrieval) {
  const metrics = [["hit@1", "hit@1"], ["hit@3", "hit@3"], ["hit@5", "hit@5"], ["mrr", "mrr"]];
  return metrics.map(([key, label]) => `
    <div class="card"><div class="muted" style="margin-bottom:var(--s2)">${label}</div><div class="bars">
    ${Object.keys(retrieval).map((m) => { const v = retrieval[m].summary[key]; return `
      <div class="bar-row"><span>${MODE_NAME[m]}</span><div class="track"><div class="fill" style="width:${v * 100}%;background:${MODE_COLOR[m]}"></div></div><b>${v.toFixed(2)}</b></div>`; }).join("")}
    </div></div>`).join("");
}

function generationTiles(g) {
  const s = g.summary, t = [];
  const add = (k, label, ic) => { if (s[k] !== undefined) t.push(tile(label, pct(s[k]), ic)); };
  add("faithful", "faithful (judge)", icon('<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/>'));
  add("correct", "correct (judge)", icon('<path d="M20 6L9 17l-5-5"/>'));
  add("fact_coverage", "required facts present", icon('<path d="M4 6h16M4 12h16M4 18h10"/>'));
  add("citation_valid", "citations valid", icon('<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>'));
  add("citation_on_expected_page", "cites the right page", icon('<path d="M6 3h9l3 3v15H6z"/>'));
  add("correct_abstention", "says “not in the docs” when it isn't", icon('<circle cx="12" cy="12" r="9"/><path d="M5 5l14 14"/>'));
  return `<div class="tiles">${t.join("")}</div>`;
}

function questionTable(latest) {
  const modes = Object.keys(latest.retrieval);
  const rows = latest.retrieval.hybrid.questions.map((q, i) => `<tr>
    <td>${esc(q.id)}</td><td>${esc(q.question)}</td>
    ${modes.map((m) => `<td>${rankBadge(latest.retrieval[m].questions[i].rank)}</td>`).join("")}
    <td class="muted">${q.top.map((t) => esc(t.source.replace(".mdx", ""))).join("<br>")}</td></tr>`).join("");
  return `<div class="card scroll"><table><thead><tr><th>id</th><th>question</th>${modes.map((m) => `<th>${MODE_NAME[m]}</th>`).join("")}<th>top hybrid results</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function historyTable(history) {
  const rows = history.slice().reverse().map((h) => `<tr><td>${esc(h.created.replace("T", " ").replace("+00:00", " utc"))}</td><td>${esc(h.label || "")}</td>
    <td>${h.hybrid["hit@1"].toFixed(2)}</td><td>${h.hybrid["hit@5"].toFixed(2)}</td><td>${h.hybrid.mrr.toFixed(2)}</td>
    <td>${h.generation && h.generation.correct !== undefined ? pct(h.generation.correct) : "–"}</td></tr>`).join("");
  return `<div class="card scroll"><table><thead><tr><th>run</th><th>note</th><th>hit@1</th><th>hit@5</th><th>mrr</th><th>correct</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

fetch("/api/evals").then(async (res) => {
  if (!res.ok) throw new Error((await res.json()).detail);
  return res.json();
}).then(({ latest, history }) => {
  const h = latest.retrieval.hybrid.summary;
  const gen = latest.generation;
  $("#root").innerHTML = `
    <p class="muted">${icon('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')}latest run ${esc(latest.created.replace("T", " ").replace("+00:00", " utc"))} · ${latest.config.chunks} chunks · ${h.n} answerable questions${latest.label ? " · " + esc(latest.label) : ""}</p>
    <h2>${icon('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>')}retrieval (does the right page come back?)</h2>
    <div class="tiles">
      ${tile("hit@1", pct(h["hit@1"]), icon('<path d="M5 12l5 5L20 7"/>'))}
      ${tile("hit@3", pct(h["hit@3"]), icon('<path d="M5 12l5 5L20 7"/>'))}
      ${tile("hit@5", pct(h["hit@5"]), icon('<path d="M5 12l5 5L20 7"/>'))}
      ${tile("mrr", h.mrr.toFixed(2), icon('<path d="M3 17l6-6 4 4 8-8"/>'))}
    </div>
    <h2>${icon('<path d="M3 3v18h18"/><path d="M8 17V9M13 17V5M18 17v-6"/>')}keyword vs semantic vs hybrid</h2>
    <div class="legend">${Object.keys(latest.retrieval).map((m) => `<span><i class="dot" style="background:${MODE_COLOR[m]}"></i>${MODE_NAME[m]}</span>`).join("")}</div>
    <div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${compare(latest.retrieval)}</div>
    <h2>${icon('<path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14l-4-3H6a2 2 0 0 1-2-2z"/>')}answers</h2>
    ${gen ? generationTiles(gen) : `<div class="banner">No answer evals in this run. Run <code>python -m evals.run --judge</code> with an API key to grade answers.</div>`}
    <h2>${icon('<path d="M4 6h16M4 12h16M4 18h16"/>')}every question</h2>
    ${questionTable(latest)}
    <h2>${icon('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>')}run history</h2>
    ${historyTable(history)}`;
}).catch((e) => { $("#root").innerHTML = `<div class="banner">${esc(e.message)}</div>`; });
</script>
</body>
</html>
